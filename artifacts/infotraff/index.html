<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>InfoTraff — AI CCTV Analytics for Retail, F&B & Manufacturing | Egypt & MENA</title>
    <meta name="description" content="InfoTraff turns your existing CCTV cameras into a real-time intelligence platform. Detect queues, PPE violations, theft, and restricted-zone breaches — with instant alerts via Telegram, SMS & email. No hardware swap. Live in days." />
    <meta name="keywords" content="AI CCTV analytics Egypt, retail video analytics Egypt, queue detection, loss prevention Egypt, PPE compliance monitoring, manufacturing AI Egypt, warehouse analytics, video intelligence Egypt, smart surveillance Cairo, real-time alerts, AI camera Egypt, CCTV analytics MENA" />
    <meta name="author" content="InfoTraff" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="canonical" href="https://infotraff.org/" />

    <!-- Geo targeting — Egypt / MENA -->
    <meta name="geo.region" content="EG" />
    <meta name="geo.placename" content="Egypt" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://infotraff.org/" />
    <meta property="og:site_name" content="InfoTraff" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="InfoTraff — AI CCTV Analytics | See Everything. Miss Nothing." />
    <meta property="og:description" content="Turn your existing cameras into a real-time intelligence system. Instant alerts for queues, theft, PPE violations & more — live in days, not months." />
    <meta property="og:image" content="https://infotraff.org/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InfoTraff AI CCTV Analytics Platform" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InfoTraff — AI CCTV Analytics | See Everything. Miss Nothing." />
    <meta name="twitter:description" content="Turn your existing cameras into a real-time intelligence system. Instant alerts for queues, theft, PPE violations & more." />
    <meta name="twitter:image" content="https://infotraff.org/opengraph.jpg" />
    <meta name="twitter:image:alt" content="InfoTraff AI CCTV Analytics Platform" />

    <!-- Preload first visible detection image -->
    <link rel="preload" as="image" href="/images/detection-factory-ppe.webp" fetchpriority="high" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "InfoTraff",
      "url": "https://infotraff.org",
      "logo": "https://infotraff.org/favicon.svg",
      "description": "InfoTraff delivers AI-powered CCTV analytics for retail, manufacturing, F&B, and warehouses across Egypt and the MENA region.",
      "areaServed": [
        { "@type": "Country", "name": "Egypt" },
        { "@type": "Place", "name": "MENA" }
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Sales",
        "availableLanguage": ["English", "Arabic"]
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "InfoTraff",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Cloud",
      "description": "AI-powered video analytics platform that turns any existing CCTV camera into a real-time intelligence system — detecting queues, PPE violations, theft, crowd buildups, and more with instant notifications.",
      "featureList": [
        "Real-time queue detection",
        "PPE compliance monitoring",
        "Loss prevention and theft alerts",
        "Crowd density analysis",
        "Restricted zone detection",
        "Telegram, SMS & email notifications",
        "REST API & Webhooks",
        "No hardware replacement required"
      ],
      "provider": {
        "@type": "Organization",
        "name": "InfoTraff",
        "url": "https://infotraff.org"
      },
      "offers": {
        "@type": "Offer",
        "description": "Book a live demo to see InfoTraff in action."
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
