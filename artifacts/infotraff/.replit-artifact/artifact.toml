kind = "web"
previewPath = "/"
title = "InfoTraff - Traffic Intelligence"
version = "1.0.0"
id = "artifacts/infotraff"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23824
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/infotraff run dev"

[services.env]
PORT = "23824"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/infotraff", "run", "build"]
publicDir = "artifacts/infotraff/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
