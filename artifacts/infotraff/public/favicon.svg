<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#0d0d0d"/>

  <!-- Traffic light housing -->
  <rect x="55" y="20" width="70" height="140" rx="18" fill="#1a1a1a" stroke="#333" stroke-width="3"/>

  <!-- Red light -->
  <circle cx="90" cy="55" r="22" fill="#FF3C00"/>
  <circle cx="90" cy="55" r="16" fill="#FF5522" opacity="0.85"/>
  <circle cx="83" cy="48" r="5" fill="white" opacity="0.35"/>

  <!-- Yellow light -->
  <circle cx="90" cy="90" r="22" fill="#FFB800"/>
  <circle cx="90" cy="90" r="16" fill="#FFC933" opacity="0.85"/>
  <circle cx="83" cy="83" r="5" fill="white" opacity="0.35"/>

  <!-- Green light -->
  <circle cx="90" cy="125" r="22" fill="#22CC44"/>
  <circle cx="90" cy="125" r="16" fill="#33DD55" opacity="0.85"/>
  <circle cx="83" cy="118" r="5" fill="white" opacity="0.35"/>
